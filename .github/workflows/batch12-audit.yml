name: Inspect professional relevance of batches 1 and 2
on:
  push:
    branches:
      - chatgpt/geo-curated-batch12-20261012
    paths:
      - audit_relevance.py
      - expanded_source_targets.json
      - .github/workflows/batch12-audit.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  audit-original-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout original first-batch image and source index
        uses: actions/checkout@v4
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download second-batch source manifest
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 38239408298
          name: geo-expanded-master-original-source-index
          path: raw_index/
      - name: Install source auditing library
        run: |
          python -m pip install playwright beautifulsoup4 requests pymupdf
          python -m playwright install --with-deps chromium
      - name: Examine each original publication for actual mineral exploration roles or policies
        run: python -u audit_relevance.py
      - name: Upload auditable professional relevance decisions
        uses: actions/upload-artifact@v4
        with:
          name: geo-batch12-professional-relevance-audit
          path: filter_audit/
          if-no-files-found: error
          retention-days: 90
