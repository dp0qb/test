name: Expanded original recruitment and employment policy source captures
on:
  push:
    branches:
      - chatgpt/geo-recruit-policy-expanded-20261012
    paths:
      - expanded_source_targets.json
      - expanded_capture.py
      - .github/workflows/expanded-geo-sources.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture-original-sites:
    strategy:
      fail-fast: false
      matrix:
        category:
          - enterprise_recruit
          - geology_institution_recruit
          - graduate_employment_policy
          - geological_industry_policy_data
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CAPTURE_CATEGORY: ${{ matrix.category }}
    steps:
      - name: Checkout source site URL list and browser capture script
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Chromium and immutable source file validators
        run: |
          python -m pip install playwright requests pillow pymupdf
          python -m playwright install --with-deps chromium
      - name: Save only original-browser-rendered source screenshots and raw attachments
        run: python -u expanded_capture.py
      - name: Verify all source files and per-part SHA-256 hashes
        run: |
          python - <<'PY'
          import csv,hashlib,os
          from pathlib import Path
          cat=os.environ['CAPTURE_CATEGORY']
          root=Path('expanded_sources')/cat
          partroot=Path('download_parts')/cat
          rows=list(csv.DictReader((root/'source_manifest.csv').open(encoding='utf-8-sig')))
          assert len(rows)>5, 'too few captured source files'
          for row in rows:
              p=Path(row['file'])
              assert p.stat().st_size==int(row['bytes'])
              assert hashlib.sha256(p.read_bytes()).hexdigest()==row['sha256']
          parts=list(partroot.glob('part*'))
          assert parts
          print('VERIFIED_CATEGORY',cat,'FILES',len(rows),'PARTS',len(parts))
          PY
      - name: Upload original part 01
        uses: actions/upload-artifact@v4
        with:
          name: expanded-${{ matrix.category }}-part01
          path: download_parts/${{ matrix.category }}/part01/
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 90
      - name: Upload original part 02
        uses: actions/upload-artifact@v4
        with:
          name: expanded-${{ matrix.category }}-part02
          path: download_parts/${{ matrix.category }}/part02/
