name: Consolidate expanded original recruitment and employment policy index
on:
  push:
    branches:
      - chatgpt/geo-recruit-policy-expanded-20261012
    paths:
      - merge_expanded_index.py
      - .github/workflows/expanded-master-index.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  master-index:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout index compiler
        uses: actions/checkout@v4
      - name: Prepare Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install spreadsheet library
        run: python -m pip install openpyxl
      - name: Download all previously verified real-source media parts
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 38238853115
          pattern: expanded-*
          merge-multiple: false
          path: artifacts_downloaded
      - name: Cross-check original file hashes and compile 279 item searchable index
        run: python merge_expanded_index.py
      - name: Publish original source inventory for all downloadable ZIP parts
        uses: actions/upload-artifact@v4
        with:
          name: geo-expanded-master-original-source-index
          path: |
            master_index/全部279份原始资料索引.csv
            master_index/失败来源记录.csv
            master_index/分类采集结果.json
            master_index/资源勘查工程_2026至2027招聘和政策_原始资料总索引.xlsx
          if-no-files-found: error
          retention-days: 90
