name: Verified integrated original sources - first and second batches
on:
  push:
    branches: [chatgpt/geo-curated-batch12-20261012]
    paths:
      - build_curated_bundle.py
      - .github/workflows/geo-curated-batch12.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  filter-integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout first-batch original source bytes
        uses: actions/checkout@v4
      - name: Set up Python for source verification and spreadsheet indexing
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install original file format and index libraries
        run: python -m pip install openpyxl pillow pymupdf python-docx
      - name: Download every original second-batch artifact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 38238853115
          pattern: expanded-*
          merge-multiple: false
          path: second_parts/
      - name: Load immutable second-batch master original file manifest
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 38239408298
          name: geo-expanded-master-original-source-index
          path: second_index/
      - name: Filter unrelated employers, verify originals, deduplicate and produce larger integrated ZIP files
        run: python -u build_curated_bundle.py
      - name: Organize final archives into few independent artifact uploads
        run: |
          python - <<'PY'
          import glob,pathlib,shutil
          bundles=sorted(pathlib.Path('curated_delivery/可下载精选压缩包').glob('*.zip'))
          assert len(bundles)>=1 and len(bundles)<=5,len(bundles)
          for i,b in enumerate(bundles,1):
              out=pathlib.Path('curated_delivery')/f'upload_part{i:02d}'
              out.mkdir(exist_ok=True)
              shutil.copy2(b,out/b.name)
          print('FINAL_UPLOAD_COUNTS',len(bundles),'FILES',[(p.name,p.stat().st_size) for p in bundles])
          PY
      - name: Upload curated originals part 01
        uses: actions/upload-artifact@v4
        with:
          name: solid-mineral-curated-originals-part01
          path: curated_delivery/upload_part01/*.zip
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 90
      - name: Upload curated originals part 02
        uses: actions/upload-artifact@v4
        with:
          name: solid-mineral-curated-originals-part02
          path: curated_delivery/upload_part02/*.zip
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 90
      - name: Upload curated originals part 03
        uses: actions/upload-artifact@v4
        with:
          name: solid-mineral-curated-originals-part03
          path: curated_delivery/upload_part03/*.zip
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 90
      - name: Upload curated originals part 04
        uses: actions/upload-artifact@v4
        with:
          name: solid-mineral-curated-originals-part04
          path: curated_delivery/upload_part04/*.zip
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 90
      - name: Upload curated originals part 05
        uses: actions/upload-artifact@v4
        with:
          name: solid-mineral-curated-originals-part05
          path: curated_delivery/upload_part05/*.zip
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 90
      - name: Upload complete keep/exclude index and batch mappings
        uses: actions/upload-artifact@v4
        with:
          name: solid-mineral-curated-master-index-batch12
          path: |
            curated_delivery/索引与审核记录/
            curated_delivery/分卷说明.json
            curated_delivery/分卷文件列表.csv
          if-no-files-found: error
          retention-days: 90
