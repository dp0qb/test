      - name: Upload all parts source index
        uses: actions/upload-artifact@v4
        with:
          name: geo-original-parts-index
          path: |
            parts/ALL_PARTS_MANIFEST.csv
            parts/REJECTED_FILES.txt
          if-no-files-found: ignore
          retention-days: 90
